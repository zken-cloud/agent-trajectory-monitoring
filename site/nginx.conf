server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Emit RELATIVE redirects. nginx listens on :8080 behind the LB, and an
    # absolute redirect leaks that port into the Location header - :8080 is not
    # published by the LB, so the browser hangs. Worse, a cached 301 keeps
    # sending it there after the server is fixed. (Learned on cm-ci-lab.)
    absolute_redirect off;

    # The gate. IAP has already established WHO you are; this establishes that
    # you were given the token. The comparison lives here, server-side, so the
    # value is never sent to a browser.
    location = /token      { try_files /token.html =404; }
    location = /token.html { }
    location = /favicon.ico { access_log off; }
    location = /healthz    { access_log off; return 200 "ok\n"; }

    location / {
        set $gate "";
        if ($cookie_site_token != "trajectory") { set $gate "wrong"; }
        if ($cookie_site_token = "")            { set $gate "none"; }
        if ($gate = "wrong") { return 302 /token?e=1; }
        if ($gate = "none")  { return 302 /token; }
        # $uri.html is what makes /demo and /demo-real work without the
        # extension; the final /index.html keeps deep links to guide anchors
        # from 404ing.
        try_files $uri $uri.html /index.html;
    }
}
