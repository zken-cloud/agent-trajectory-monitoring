-- ============================================================================
-- Lab 2.3 - Trajectory graph queries.
--
-- THE GRAPH IS AN INVESTIGATION TIER, NOT A DETECTION TIER.
-- Layer 1 flags candidate sessions cheaply in BigQuery; you query the graph
-- SCOPED to what it flagged, as a human deciding whether the finding is real.
-- An unbounded MATCH over every untrusted asset with a {1,4} traversal is fine
-- across 300 sessions and untenable at ~4M new edges/day.
-- ============================================================================


-- Q1 -------------------------------------------------------------------------
-- Reconstruct ONE session. This is the query that replaces the 15 minutes of
-- self-joins from Lab 2.2. Run it against an A2 session and compare.
GRAPH TrajectoryGraph
MATCH (s:Session {session_id: @session_id})
      -[:HAS]->(i:Invocation)-[:PLANNED]->(l:LlmCall)-[:DECIDED]->(t:ToolCall)
      -[:OF_TOOL]->(tool:Tool)
RETURN i.turn_index, l.llm_call_id, l.context_has_untrusted,
       tool.tool_name, tool.sensitivity, tool.is_egress, t.status
ORDER BY i.turn_index, t.ts;


-- Q2 -------------------------------------------------------------------------
-- THE PAYOFF QUERY. Untrusted source reaching an egress sink - structurally the
-- same query Wiz runs for cloud attack paths, and the same thing an analyst
-- does by hand, minus the joins.
--
-- It reveals A2 - indirect prompt injection - WITHOUT it being enumerated as a
-- rule, because it matches a SHAPE rather than a signature. That is the
-- argument for graph, and it is the strongest idea in the workshop.
--
-- It does NOT catch A3, and should not: A3 reads a customer record (TRUSTED)
-- and mails it out. There is no untrusted source, so there is no taint path.
-- A3 is Q4's job. Asking the right question of the graph matters as much as
-- having the graph.
-- NOTE ON PATH LENGTH. An earlier draft wrote -[:DECIDED]->{1,4} here, copying
-- the variable-length shape from Wiz's cloud attack paths. That is WRONG for
-- this graph: DECIDED runs LlmCall -> ToolCall, and ToolCall has no outgoing
-- DECIDED edge, so the pattern can never repeat. It is also unnecessary -
-- FLOWED_INTO is materialised per LLM call, so an untrusted asset already links
-- DIRECTLY to every model call that saw it in context. First-order is complete.
-- See Q2b for the case that genuinely needs variable length.
GRAPH TrajectoryGraph
MATCH (d:DataAsset)-[:FLOWED_INTO]->(l:LlmCall)
      -[:DECIDED]->(t:ToolCall)-[:OF_TOOL]->(tool:Tool)
WHERE d.trust_label = 'UNTRUSTED'
  AND tool.is_egress
  AND l.session_id IN UNNEST(@flagged_sessions)   -- <- the scope. Keep it.
RETURN l.session_id, d.asset_id, tool.tool_name, t.tool_call_id, t.status
ORDER BY l.session_id;


-- Q2b ------------------------------------------------------------------------
-- SECOND-ORDER taint, where variable length genuinely earns its place: an
-- untrusted asset influences a model call, which reads ANOTHER asset, which
-- influences a later model call, which egresses. Each repetition is a full
-- influence->read cycle, so the pattern actually repeats.
GRAPH TrajectoryGraph
MATCH (d:DataAsset WHERE d.trust_label = 'UNTRUSTED')
      ((:DataAsset)-[:FLOWED_INTO]->(:LlmCall)-[:DECIDED]->(:ToolCall)-[:READ]->(:DataAsset)){1,3}
      -[:FLOWED_INTO]->(l:LlmCall)-[:DECIDED]->(t:ToolCall)-[:OF_TOOL]->(tool:Tool)
WHERE tool.is_egress AND l.session_id IN UNNEST(@flagged_sessions)
RETURN l.session_id, d.asset_id, t.tool_call_id;


-- Q3 -------------------------------------------------------------------------
-- Run Q2 and it fires on benign sessions too. It is not wrong - it is
-- UNDER-SPECIFIED, exactly like D2 in Lab 2.4. A legitimate "email the customer
-- their return label" session genuinely IS untrusted-KB-then-egress.
--
-- Refine with the two facts the naive query ignored: where the data went, and
-- whether a human approved. THIS is the lesson - the refinement, not the query.
GRAPH TrajectoryGraph
MATCH (d:DataAsset)-[:FLOWED_INTO]->(l:LlmCall)
      -[:DECIDED]->(t:ToolCall)-[:WROTE_TO]->(e:ExternalEndpoint)
WHERE d.trust_label = 'UNTRUSTED'
  AND NOT e.allowlisted                            -- destination we do NOT control
  AND l.session_id IN UNNEST(@flagged_sessions)
  AND NOT EXISTS {
        MATCH (l2:LlmCall)-[:DECIDED]->(:ToolCall)-[:OF_TOOL]->(ht:Tool)
        WHERE l2.session_id = l.session_id AND ht.tool_name = 'escalate_to_human'
      }
RETURN l.session_id, d.asset_id, e.endpoint_id, t.tool_call_id;


-- Q4 -------------------------------------------------------------------------
-- Full exfiltration path: which SENSITIVE asset actually left, and through
-- which endpoint. Q2/Q3 prove untrusted content influenced an egress call;
-- this answers "what was in the envelope".
-- The PII is followed through FLOWED_INTO into the LATER model call that
-- egressed it. Do NOT try to hang both the read and the write off one LlmCall:
-- each model turn decides one tool, so that pattern never matches. (It was
-- wrong in an earlier draft and the validator caught it returning zero rows.)
GRAPH TrajectoryGraph
MATCH (pii:DataAsset)-[:FLOWED_INTO]->(l:LlmCall)
      -[:DECIDED]->(t:ToolCall)-[:WROTE_TO]->(e:ExternalEndpoint)
WHERE pii.asset_id LIKE 'customer:%'
  AND NOT e.allowlisted
RETURN l.session_id, pii.asset_id, e.endpoint_id, t.status
ORDER BY l.session_id;


-- Q5 -------------------------------------------------------------------------
-- Attacks that were STOPPED. Blocked calls are telemetry too, so the graph
-- shows enforcement working, not just damage done (Lab 2.6).
GRAPH TrajectoryGraph
MATCH (t:ToolCall)-[:OF_TOOL]->(tool:Tool)
WHERE t.status = 'blocked'
RETURN t.session_id, tool.tool_name, t.enforcement_rule, t.ts
ORDER BY t.ts DESC;


-- Q6 -------------------------------------------------------------------------
-- Triage worklist for the lab: the flagged sessions, with the evidence the
-- graph can add. Attendees work this list and decide which are real.
GRAPH TrajectoryGraph
MATCH (s:Session)-[:HAS]->(:Invocation)-[:PLANNED]->(l:LlmCall)
WHERE s.flagged
OPTIONAL MATCH (d:DataAsset)-[:FLOWED_INTO]->(l) WHERE d.trust_label = 'UNTRUSTED'
RETURN s.session_id, s.outcome,
       COUNT(DISTINCT d.asset_id) AS untrusted_assets_in_context
GROUP BY s.session_id, s.outcome
ORDER BY untrusted_assets_in_context DESC;
